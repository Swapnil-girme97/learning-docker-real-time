
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mobile Banking</h1>
</header>

<div class="container">

    <h2>Welcome to Mobile Banking</h2>

    <div class="card">
        <h3>Account Balance</h3>
        <p>₹ 75,000</p>
    </div>

    <div class="services">

        <div class="box">
            <h3>UPI Transfer</h3>
            <button>Pay Now</button>
        </div>

        <div class="box">
            <h3>QR Scan</h3>
            <button>Scan</button>
        </div>

        <div class="box">
            <h3>Mobile Recharge</h3>
            <button>Recharge</button>
        </div>

        <div class="box">
            <h3>Bill Payment</h3>
            <button>Pay Bills</button>
        </div>

    </div>

</div>

<footer>
    © 2026 Banking Demo Application
</footer>

</body>
</html>
